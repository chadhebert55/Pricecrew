openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
security:
  - clerkAuth: []
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Estimating dashboard operations
  - name: quotes
    description: Quote and estimate operations
  - name: customers
    description: Company customer records and quote history
  - name: price-book
    description: Company price book operations
  - name: settings
    description: Company estimating settings
paths:
  /healthz:
    get:
      security: []
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get estimating dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /customers:
    get:
      operationId: listCustomers
      tags: [customers]
      summary: List company customers
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Customer list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CustomerSummary"
    post:
      operationId: createCustomer
      tags: [customers]
      summary: Create a company customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerInput"
      responses:
        "201":
          description: Created customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerSummary"
  /customers/{id}:
    get:
      operationId: getCustomer
      tags: [customers]
      summary: Get a customer and quote history
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Customer detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerDetail"
        "404":
          description: Customer not found
    patch:
      operationId: updateCustomer
      tags: [customers]
      summary: Update a customer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerUpdate"
      responses:
        "200":
          description: Updated customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerSummary"
        "404":
          description: Customer not found
  /quotes:
    get:
      operationId: listQuotes
      tags: [quotes]
      summary: List quotes
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/QuoteStatus"
      responses:
        "200":
          description: Quote list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QuoteSummary"
    post:
      operationId: createQuote
      tags: [quotes]
      summary: Create a quote from an estimate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteInput"
      responses:
        "201":
          description: Created quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
  /quotes/preview:
    post:
      operationId: previewQuote
      tags: [quotes]
      summary: Preview an authoritative estimate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuotePreviewInput"
      responses:
        "200":
          description: Authoritative estimate preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EstimatePreview"
  /proposals/{token}:
    get:
      security: []
      operationId: getCustomerProposal
      tags: [quotes]
      summary: Get a customer-safe proposal
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
            minLength: 50
      responses:
        "200":
          description: Customer-safe proposal without estimator costs or catalog metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerProposal"
        "404":
          description: Proposal not found
  /quotes/{id}:
    get:
      operationId: getQuote
      tags: [quotes]
      summary: Get a quote
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Quote detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
        "404":
          description: Quote not found
    patch:
      operationId: updateQuote
      tags: [quotes]
      summary: Update a quote
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteUpdate"
      responses:
        "200":
          description: Updated quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteUpdateResult"
        "404":
          description: Quote not found
  /quotes/{id}/duplicate:
    post:
      operationId: duplicateQuote
      tags: [quotes]
      summary: Create an immutable draft revision from a quote snapshot
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "201":
          description: New draft quote revision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
        "404":
          description: Quote not found
  /price-book:
    get:
      operationId: listPriceBookItems
      tags: [price-book]
      summary: List price book items
      responses:
        "200":
          description: Price book items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PriceBookItem"
  /price-book/{id}:
    patch:
      operationId: updatePriceBookItem
      tags: [price-book]
      summary: Update a price book item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PriceBookItemUpdate"
      responses:
        "200":
          description: Updated price book item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceBookItem"
        "404":
          description: Price book item not found
  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get company estimating settings
      responses:
        "200":
          description: Company settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanySettings"
    patch:
      operationId: updateSettings
      tags: [settings]
      summary: Update company estimating settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanySettingsUpdate"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanySettings"
components:
  securitySchemes:
    clerkAuth:
      type: http
      scheme: bearer
      bearerFormat: Clerk session token
      description: Clerk authentication. Browser clients use the same-origin Clerk session cookie.
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    DashboardSummary:
      type: object
      required:
        - totalQuotes
        - draftQuotes
        - readyQuotes
        - totalQuoted
        - averageMargin
        - averageMarginQuoteSet
        - recentQuotes
      properties:
        totalQuotes:
          type: number
        draftQuotes:
          type: number
        readyQuotes:
          type: number
        totalQuoted:
          type: number
          deprecated: true
          description: Compatibility total of all non-demo quotes.
        draftPipelineValue:
          type: number
        readyProposalValue:
          type: number
        averageMargin:
          type: number
        averageMarginQuoteSet:
          type: string
        recentQuotes:
          type: array
          items:
            $ref: "#/components/schemas/QuoteSummary"
    CustomerSummary:
      type: object
      required:
        - id
        - name
        - email
        - quoteCount
        - totalQuoted
        - latestQuoteAt
        - createdAt
      properties:
        id:
          type: number
        name:
          type: string
        email:
          type: ["string", "null"]
        quoteCount:
          type: number
        totalQuoted:
          type: number
        latestQuoteAt:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
    CustomerDetail:
      allOf:
        - $ref: "#/components/schemas/CustomerSummary"
        - type: object
          required:
            - quotes
          properties:
            quotes:
              type: array
              items:
                $ref: "#/components/schemas/QuoteSummary"
    CustomerInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: ["string", "null"]
    CustomerUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: ["string", "null"]
    QuoteSummary:
      type: object
      required:
        - id
        - quoteNumber
        - customerName
        - projectName
        - module
        - status
        - total
        - margin
        - updatedAt
      properties:
        id:
          type: number
        quoteNumber:
          type: string
        customerName:
          type: string
        projectName:
          type: string
        module:
          type: string
        status:
          $ref: "#/components/schemas/QuoteStatus"
        total:
          type: number
        margin:
          type: number
        updatedAt:
          type: string
          format: date-time
    CustomerProposalLine:
      type: object
      required:
        - id
        - description
        - quantity
        - unit
      properties:
        id:
          type: string
        description:
          type: string
        quantity:
          type: number
        unit:
          type: string
    CustomerProposal:
      type: object
      required:
        - quoteNumber
        - customerName
        - projectName
        - status
        - proposalDescription
        - createdAt
        - finalSellingPrice
        - scope
        - company
        - terms
      properties:
        quoteNumber:
          type: string
        customerName:
          type: string
        projectName:
          type: string
        status:
          $ref: "#/components/schemas/QuoteStatus"
        proposalDescription:
          type: string
        createdAt:
          type: string
          format: date-time
        finalSellingPrice:
          type: number
        scope:
          type: array
          items:
            $ref: "#/components/schemas/CustomerProposalLine"
        company:
          $ref: "#/components/schemas/ProposalCompanyPresentation"
        terms:
          type: string
    ProposalCompanyPresentation:
      type: object
      required: [displayName, accentColor]
      properties:
        displayName:
          type: string
        contactPhone:
          type: ["string", "null"]
        contactEmail:
          type: ["string", "null"]
        contactAddress:
          type: ["string", "null"]
        accentColor:
          type: string
    Quote:
      allOf:
        - $ref: "#/components/schemas/QuoteSummary"
        - type: object
          required:
            - customerEmail
            - jobInputs
            - assembly
            - pricing
            - proposalDescription
            - createdAt
          properties:
            customerId:
              type: ["number", "null"]
              description: Authenticated contractor-only customer identity used when revising a quote.
            customerEmail:
              type: ["string", "null"]
            jobInputs:
              $ref: "#/components/schemas/QuoteJobInputsSnapshot"
            assembly:
              type: array
              items:
                $ref: "#/components/schemas/AssemblyLine"
            pricing:
              $ref: "#/components/schemas/PricingSummary"
            proposalDescription:
              type: string
            sourceQuoteId:
              type: ["number", "null"]
            revisionNumber:
              type: number
            createdAt:
              type: string
              format: date-time
    QuoteUpdateResult:
      allOf:
        - $ref: "#/components/schemas/Quote"
        - type: object
          required:
            - proposalShareToken
          properties:
            proposalShareToken:
              type: ["string", "null"]
              description: Rotating signed token issued only for ready customer proposals.
    QuoteInput:
      type: object
      required:
        - customerName
        - projectName
        - module
        - jobInputs
        - proposalDescription
      properties:
        customerId:
          type: number
          minimum: 1
          description: Existing customer ID, validated against the authenticated company.
        sourceQuoteId:
          type: number
          minimum: 1
          description: Optional immutable source quote ID. The server verifies company and module ownership and creates a new revision.
        customerName:
          type: string
          minLength: 1
        customerEmail:
          type: ["string", "null"]
        projectName:
          type: string
          minLength: 1
        module:
          type: string
          enum:
            - EV_CHARGER
            - BATHROOM
            - KITCHEN
            - RECESSED_LIGHTING
            - SERVICE_UPGRADE
            - PANEL_REPLACEMENT
            - SERVICE_CALL
            - TIME_MATERIALS
            - CUSTOM
        jobInputs:
          oneOf:
            - $ref: "#/components/schemas/EvChargerInputs"
            - $ref: "#/components/schemas/BathroomInputs"
            - $ref: "#/components/schemas/KitchenInputs"
            - $ref: "#/components/schemas/RecessedLightingInputs"
            - $ref: "#/components/schemas/ServiceUpgradeInputs"
            - $ref: "#/components/schemas/PanelReplacementInputs"
            - $ref: "#/components/schemas/ServiceCallInputs"
            - $ref: "#/components/schemas/TimeMaterialsInputs"
            - $ref: "#/components/schemas/CustomInputs"
        laborOverride:
          type: ["number", "null"]
          minimum: 0
          maximum: 999999999.99
        sellingPriceOverride:
          type: ["number", "null"]
          minimum: 0
          maximum: 999999999.99
        proposalDescription:
          type: string
          minLength: 1
    QuoteJobInputsSnapshot:
      description: Immutable saved input snapshot. The open object branch keeps historical quote shapes readable without rewriting them.
      oneOf:
        - $ref: "#/components/schemas/EvChargerInputs"
        - $ref: "#/components/schemas/BathroomInputs"
        - $ref: "#/components/schemas/KitchenInputs"
        - $ref: "#/components/schemas/RecessedLightingInputs"
        - $ref: "#/components/schemas/ServiceUpgradeInputs"
        - $ref: "#/components/schemas/PanelReplacementInputs"
        - $ref: "#/components/schemas/ServiceCallInputs"
        - $ref: "#/components/schemas/TimeMaterialsInputs"
        - $ref: "#/components/schemas/CustomInputs"
        - type: object
          additionalProperties: true
    QuotePreviewInput:
      type: object
      required:
        - module
        - jobInputs
      properties:
        module:
          type: string
          enum:
            - EV_CHARGER
            - BATHROOM
            - KITCHEN
            - RECESSED_LIGHTING
            - SERVICE_UPGRADE
            - PANEL_REPLACEMENT
            - SERVICE_CALL
            - TIME_MATERIALS
            - CUSTOM
        jobInputs:
          oneOf:
            - $ref: "#/components/schemas/EvChargerInputs"
            - $ref: "#/components/schemas/BathroomInputs"
            - $ref: "#/components/schemas/KitchenInputs"
            - $ref: "#/components/schemas/RecessedLightingInputs"
            - $ref: "#/components/schemas/ServiceUpgradeInputs"
            - $ref: "#/components/schemas/PanelReplacementInputs"
            - $ref: "#/components/schemas/ServiceCallInputs"
            - $ref: "#/components/schemas/TimeMaterialsInputs"
            - $ref: "#/components/schemas/CustomInputs"
        laborOverride:
          type: ["number", "null"]
          minimum: 0
          maximum: 999999999.99
        sellingPriceOverride:
          type: ["number", "null"]
          minimum: 0
          maximum: 999999999.99
    EstimatePreview:
      type: object
      required:
        - assembly
        - pricing
      properties:
        assembly:
          type: array
          items:
            $ref: "#/components/schemas/AssemblyLine"
        pricing:
          $ref: "#/components/schemas/PricingSummary"
        planning:
          $ref: "#/components/schemas/RecessedLightingPlanning"
    QuoteUpdate:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/QuoteStatus"
        laborOverride:
          type: ["number", "null"]
          minimum: 0
          maximum: 999999999.99
        sellingPriceOverride:
          type: ["number", "null"]
          minimum: 0
          maximum: 999999999.99
        proposalDescription:
          type: string
    EvChargerInputs:
      type: object
      required:
        - chargerQuantity
        - chargerOutputAmps
        - circuitAmps
        - chargerSupply
        - connection
        - routeLength
        - wiringMethod
        - location
        - panelManufacturer
        - panelSpace
        - breakerRequirement
        - access
        - permit
        - loadManagement
        - disconnect
        - surgeProtection
        - panelModifications
        - difficulty
        - notes
      properties:
        chargerQuantity:
          type: number
        chargerOutputAmps:
          type: number
        circuitAmps:
          type: string
        chargerSupply:
          type: string
        connection:
          type: string
        routeLength:
          type: number
          minimum: 0
        wiringMethod:
          type: string
        cableType:
          type: string
          enum:
            - 8/3 NM-B
            - 8/2 NM-B
            - 6/3 NM-B
            - 8/2 SER
        location:
          type: string
        panelManufacturer:
          type: string
        panelSpace:
          type: string
        breakerRequirement:
          type: string
        access:
          type: string
        permit:
          type: string
        loadManagement:
          type: string
        disconnect:
          type: string
        surgeProtection:
          type: string
        panelModifications:
          type: string
        difficulty:
          type: string
        notes:
          type: string
        laborRateType:
          $ref: "#/components/schemas/LaborRateType"
        laborAdjustmentHours:
          type: number
          description: Quote-level adjustment added to the detailed task labor calculation.
    BathroomInputs:
      type: object
      required:
        - gfciReceptacles
        - additionalReceptacles
        - vanityLights
        - recessedLights
        - exhaustFans
        - fanLights
        - fanLightHeatUnits
        - heatedFloorCircuit
        - additionalSwitches
        - circuitOption
        - customerSuppliedFixtures
        - notes
      properties:
        gfciReceptacles:
          type: number
          minimum: 0
        additionalReceptacles:
          type: number
          minimum: 0
        vanityLights:
          type: number
          minimum: 0
        recessedLights:
          type: number
          minimum: 0
        exhaustFans:
          type: number
          minimum: 0
        fanLights:
          type: number
          minimum: 0
        fanLightHeatUnits:
          type: number
          minimum: 0
        heatedFloorCircuit:
          type: boolean
        additionalSwitches:
          type: number
          minimum: 0
        routeLength:
          type: number
          minimum: 0
        circuitOption:
          type: string
          enum:
            - New dedicated circuit
            - Reuse existing circuit
        customerSuppliedFixtures:
          type: boolean
        notes:
          type: string
        laborRateType:
          $ref: "#/components/schemas/LaborRateType"
        laborAdjustmentHours:
          type: number
          description: Quote-level adjustment added to the detailed task labor calculation.
        exhaustFanMaterialCostOverride:
          type: number
          minimum: 0
          description: Optional quote-local unit-cost override for the contractor-supplied standard exhaust fan.
        fanLightMaterialCostOverride:
          type: number
          minimum: 0
          description: Optional quote-local unit-cost override for the contractor-supplied fan/light combination.
        fanLightHeatMaterialCostOverride:
          type: number
          minimum: 0
          description: Optional quote-local unit-cost override for the contractor-supplied fan/light/heat combination.
        newCircuitCableFootage:
          type: number
          minimum: 0
          description: Dedicated 14/2 NM-B footage for the optional new 15A bathroom circuit.
        newCircuitMaterialsQuantity:
          type: number
          minimum: 0
          description: Quantity of normal box, device, connector, and circuit-material packages for the new 15A circuit.
        newCircuitMaterialsUnitCostOverride:
          type: number
          minimum: 0
          description: Optional quote-local unit-cost override for the new 15A circuit material package.
        newCircuitLaborHours:
          type: number
          minimum: 0
          description: Labor hours for the optional new 15A bathroom circuit.
        newCircuitBreakerProtectionType:
          type: string
          enum: [Standard, GFCI, AFCI, Dual Function]
          description: Exact protection type for the optional 15A, 1-pole bathroom circuit breaker.
        panelManufacturer:
          type: string
        breakerAmperage:
          type: number
        breakerPoleCount:
          type: number
        breakerProtectionType:
          type: string
        gfciAmperage:
          type: number
        recessedLightSize:
          type: string
          enum: [4-inch, 6-inch]
        cableType:
          type: string
          enum: [12/2 NM-B, 14/2 NM-B, 14/3 NM-B]
    RecessedLightingPlanning:
      type: object
      required:
        - suggestedFixtureQuantity
        - actualFixtureQuantity
        - spacingFeet
        - quantitySource
        - guidance
      properties:
        suggestedFixtureQuantity:
          type: number
        actualFixtureQuantity:
          type: number
        spacingFeet:
          type: number
        quantitySource:
          type: string
        guidance:
          type: string
    KitchenInputs:
      type: object
      required:
        - refrigeratorCircuits
        - dishwasherCircuits
        - disposalCircuits
        - gasRangeCircuits
        - electricRangeCircuits
        - countertopReceptacles
        - sinkLights
        - islandPendants
        - undercabinetLighting
        - recessedLights
        - threeWayOptions
        - dimmers
        - usbReceptacles
        - additionalDedicatedCircuits
        - routeLength
        - customerSuppliedFixtures
        - notes
      properties:
        refrigeratorCircuits:
          type: number
          minimum: 0
        dishwasherCircuits:
          type: number
          minimum: 0
        disposalCircuits:
          type: number
          minimum: 0
        gasRangeCircuits:
          type: number
          minimum: 0
        electricRangeCircuits:
          type: number
          minimum: 0
        countertopReceptacles:
          type: number
          minimum: 0
        sinkLights:
          type: number
          minimum: 0
        islandPendants:
          type: number
          minimum: 0
        undercabinetLighting:
          type: number
          minimum: 0
        recessedLights:
          type: number
          minimum: 0
        threeWayOptions:
          type: number
          minimum: 0
        fourWayLocations:
          type: number
          minimum: 0
        fourWayCableFootage:
          type: number
          minimum: 0
        fourWayLaborHoursPerLocation:
          type: number
          minimum: 0
        dimmers:
          type: number
          minimum: 0
        usbReceptacles:
          type: number
          minimum: 0
        additionalDedicatedCircuits:
          type: number
          minimum: 0
        routeLength:
          type: number
          minimum: 0
        includeLightingCircuit:
          type: boolean
        lightingCircuitAmperage:
          type: number
          enum: [15]
        lightingCircuitFootage:
          type: number
          minimum: 0
        lightingCircuitLaborHours:
          type: number
          minimum: 0
        smallApplianceCircuit1:
          type: boolean
        smallApplianceCircuit1Footage:
          type: number
          minimum: 0
        smallApplianceCircuit1LaborHours:
          type: number
          minimum: 0
        smallApplianceCircuit2:
          type: boolean
        smallApplianceCircuit2Footage:
          type: number
          minimum: 0
        smallApplianceCircuit2LaborHours:
          type: number
          minimum: 0
        microwaveCircuit:
          type: boolean
        microwaveCircuitFootage:
          type: number
          minimum: 0
        microwaveCircuitLaborHours:
          type: number
          minimum: 0
        smallApplianceCircuits:
          type: number
          minimum: 0
          description: Quantity of small-appliance circuits using the shared home run.
        microwaveCircuits:
          type: number
          minimum: 0
          description: Quantity of microwave circuits using the shared home run.
        applianceHomeRun12_2Length:
          type: number
          minimum: 0
          description: Shared 12/2 home-run distance from the appliance area back to the panel.
        applianceCircuitAmperage:
          type: number
          minimum: 1
        applianceCircuitCableType:
          type: string
          enum: [12/2 NM-B, 14/2 NM-B]
        applianceCircuitProtectionType:
          type: string
        breaker15AQuantity:
