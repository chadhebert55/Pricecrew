openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
security:
  - clerkAuth: []
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Estimating dashboard operations
  - name: quotes
    description: Quote and estimate operations
  - name: takeoffs
    description: Reviewable electrical plan PDF takeoffs
  - name: customers
    description: Company customer records and quote history
  - name: price-book
    description: Company price book operations
  - name: settings
    description: Company estimating settings
paths:
  /healthz:
    get:
      security: []
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get estimating dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /customers:
    get:
      operationId: listCustomers
      tags: [customers]
      summary: List company customers
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Customer list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CustomerSummary"
    post:
      operationId: createCustomer
      tags: [customers]
      summary: Create a company customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerInput"
      responses:
        "201":
          description: Created customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerSummary"
  /customers/{id}:
    get:
      operationId: getCustomer
      tags: [customers]
      summary: Get a customer and quote history
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Customer detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerDetail"
        "404":
          description: Customer not found
    patch:
      operationId: updateCustomer
      tags: [customers]
      summary: Update a customer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerUpdate"
      responses:
        "200":
          description: Updated customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerSummary"
        "404":
          description: Customer not found
  /quotes:
    get:
      operationId: listQuotes
      tags: [quotes]
      summary: List quotes
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/QuoteStatus"
      responses:
        "200":
          description: Quote list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QuoteSummary"
    post:
      operationId: createQuote
      tags: [quotes]
      summary: Create a quote from an estimate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteInput"
      responses:
        "201":
          description: Created quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
  /quotes/preview:
    post:
      operationId: previewQuote
      tags: [quotes]
      summary: Preview an authoritative estimate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuotePreviewInput"
      responses:
        "200":
          description: Authoritative estimate preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EstimatePreview"
  /takeoffs/upload-url:
    post:
      operationId: requestTakeoffUploadUrl
      tags: [takeoffs]
      summary: Request a direct upload URL for an electrical plan PDF
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TakeoffUploadRequest"
      responses:
        "200":
          description: Upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TakeoffUploadResponse"
        "400":
          description: Unsupported or oversized file
  /takeoffs:
    post:
      operationId: createTakeoff
      tags: [takeoffs]
      summary: Extract reviewable quantities from an uploaded plan PDF
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TakeoffInput"
      responses:
        "201":
          description: Extracted takeoff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Takeoff"
        "422":
          description: The PDF could not produce a safe takeoff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
  /takeoffs/{id}:
    get:
      operationId: getTakeoff
      tags: [takeoffs]
      summary: Get a takeoff and its review trail
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number, multipleOf: 1 }
      responses:
        "200":
          description: Takeoff detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Takeoff"
        "404":
          description: Takeoff not found
  /takeoffs/{id}/document:
    get:
      operationId: getTakeoffDocument
      tags: [takeoffs]
      summary: Download the source plan PDF
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number, multipleOf: 1 }
      responses:
        "200":
          description: Source PDF
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "404":
          description: Takeoff not found
  /takeoffs/{id}/items/{itemId}:
    patch:
      operationId: reviewTakeoffItem
      tags: [takeoffs]
      summary: Accept, reject, edit, or leave a takeoff item unresolved
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number, multipleOf: 1 }
        - name: itemId
          in: path
          required: true
          schema: { type: number, multipleOf: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TakeoffItemReview"
      responses:
        "200":
          description: Updated takeoff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Takeoff"
        "404":
          description: Takeoff item not found
  /proposals/{token}:
    get:
      security: []
      operationId: getCustomerProposal
      tags: [quotes]
      summary: Get a customer-safe proposal
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
            minLength: 50
      responses:
        "200":
          description: Customer-safe proposal without estimator costs or catalog metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerProposal"
        "404":
          description: Proposal not found
    post:
      security: []
      operationId: submitProposalDecision
      tags: [quotes]
      summary: Submit a customer proposal decision
      description: Accept or decline the exact ready proposal represented by the signed token.
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
            minLength: 50
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProposalDecisionInput"
      responses:
        "200":
          description: Recorded or previously recorded proposal decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalDecision"
        "404":
          description: Proposal not found or no longer current
        "409":
          description: Proposal is not ready or already has a different decision
        "422":
          description: Decision input is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
  /quotes/{id}:
    get:
      operationId: getQuote
      tags: [quotes]
      summary: Get a quote
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Quote detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
        "404":
          description: Quote not found
    patch:
      operationId: updateQuote
      tags: [quotes]
      summary: Update a quote
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteUpdate"
      responses:
        "200":
          description: Updated quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteUpdateResult"
        "404":
          description: Quote not found
  /quotes/{id}/decision:
    post:
      operationId: submitQuoteDecision
      tags: [quotes]
      summary: Record a decision for a company quote
      description: Records a decision against the currently saved ready revision of a company-owned quote.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProposalDecisionInput"
      responses:
        "200":
          description: Recorded or previously recorded proposal decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalDecision"
        "404":
          description: Quote not found
        "409":
          description: Quote is not ready or already has a different decision
        "422":
          description: Decision input is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
  /quotes/{id}/exports/preflight:
    post:
      operationId: preflightQuoteExport
      tags: [quotes]
      summary: Validate a provider-neutral saved quote export
      description: Validates a company-owned saved quote snapshot without recalculating it or reading live catalog pricing.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteExportRequest"
      responses:
        "200":
          description: Export preflight result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteExportPreflight"
        "404":
          description: Quote not found
  /quotes/{id}/exports/jobber.csv:
    post:
      operationId: exportJobberQuoteCsv
      tags: [quotes]
      summary: Download a Jobber-compatible CSV from a saved quote
      description: Generates a UTF-8 Jobber quote import CSV from the company-owned saved quote snapshot.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobberQuoteExportRequest"
      responses:
        "200":
          description: UTF-8 Jobber quote import CSV
          content:
            text/csv:
              schema:
                type: string
        "404":
          description: Quote not found
        "422":
          description: Export data is incomplete or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteExportInvalid"
  /quotes/{id}/exports/quickbooks.csv:
    post:
      operationId: exportQuickBooksQuoteCsv
      tags: [quotes]
      summary: Download a QuickBooks Online invoice CSV from a saved quote
      description: Generates a UTF-8 QuickBooks Online invoice import CSV from the company-owned saved quote snapshot.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuickBooksQuoteExportRequest"
      responses:
        "200":
          description: UTF-8 QuickBooks Online invoice import CSV
          content:
            text/csv:
              schema:
                type: string
        "404":
          description: Quote not found
        "422":
          description: Export data is incomplete or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteExportInvalid"
  /quotes/{id}/exports/housecall-pro.csv:
    post:
      operationId: exportHousecallProQuoteCsv
      tags: [quotes]
      summary: Download a Housecall Pro jobs CSV from a saved quote
      description: Generates a UTF-8 Housecall Pro jobs import CSV from the company-owned saved quote snapshot.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HousecallProQuoteExportRequest"
      responses:
        "200":
          description: UTF-8 Housecall Pro jobs import CSV
          content:
            text/csv:
              schema:
                type: string
        "404":
          description: Quote not found
        "422":
          description: Export data is incomplete or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteExportInvalid"
  /quotes/{id}/duplicate:
    post:
      operationId: duplicateQuote
      tags: [quotes]
      summary: Create an immutable draft revision from a quote snapshot
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "201":
          description: New draft quote revision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
        "404":
          description: Quote not found
  /price-book:
    get:
      operationId: listPriceBookItems
      tags: [price-book]
      summary: List price book items
      responses:
        "200":
          description: Price book items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PriceBookItem"
  /price-book/{id}:
    patch:
      operationId: updatePriceBookItem
      tags: [price-book]
      summary: Update a price book item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PriceBookItemUpdate"
      responses:
        "200":
          description: Updated price book item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceBookItem"
        "404":
          description: Price book item not found
  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get company estimating settings
      responses:
        "200":
          description: Company settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanySettings"
    patch:
      operationId: updateSettings
      tags: [settings]
      summary: Update company estimating settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanySettingsUpdate"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanySettings"
components:
  securitySchemes:
    clerkAuth:
      type: http
      scheme: bearer
      bearerFormat: Clerk session token
      description: Clerk authentication. Browser clients use the same-origin Clerk session cookie.
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ValidationError:
      type: object
      required: [error]
      properties:
        error:
          type: string
    DashboardSummary:
      type: object
      required:
        - totalQuotes
        - draftQuotes
        - readyQuotes
        - totalQuoted
        - averageMargin
        - averageMarginQuoteSet
        - recentQuotes
      properties:
        totalQuotes:
          type: number
        draftQuotes:
          type: number
        readyQuotes:
          type: number
        totalQuoted:
          type: number
          deprecated: true
          description: Compatibility total of all non-demo quotes.
        draftPipelineValue:
          type: number
        readyProposalValue:
          type: number
        averageMargin:
          type: number
        averageMarginQuoteSet:
          type: string
        recentQuotes:
          type: array
          items:
            $ref: "#/components/schemas/QuoteSummary"
    CustomerSummary:
      type: object
      required:
        - id
        - name
        - email
        - quoteCount
        - totalQuoted
        - latestQuoteAt
        - createdAt
      properties:
        id:
          type: number
        name:
          type: string
        email:
          type: ["string", "null"]
        quoteCount:
          type: number
        totalQuoted:
          type: number
        latestQuoteAt:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
    CustomerDetail:
      allOf:
        - $ref: "#/components/schemas/CustomerSummary"
        - type: object
          required:
            - quotes
          properties:
            quotes:
              type: array
              items:
                $ref: "#/components/schemas/QuoteSummary"
    CustomerInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: ["string", "null"]
    CustomerUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: ["string", "null"]
    QuoteSummary:
      type: object
      required:
        - id
        - quoteNumber
        - customerName
        - projectName
        - module
        - status
        - total
        - margin
        - updatedAt
      properties:
        id:
          type: number
        quoteNumber:
          type: string
        customerName:
          type: string
        projectName:
          type: string
        module:
          type: string
        status:
          $ref: "#/components/schemas/QuoteStatus"
        total:
          type: number
        margin:
          type: number
        updatedAt:
          type: string
          format: date-time
    CustomerProposalLine:
      type: object
      required:
        - id
        - description
        - quantity
        - unit
      properties:
        id:
          type: string
        description:
          type: string
        quantity:
          type: number
        unit:
          type: string
    CustomerProposal:
      type: object
      required:
        - quoteNumber
        - customerName
        - projectName
        - status
        - proposalDescription
        - createdAt
        - finalSellingPrice
        - scope
        - company
        - terms
        - decision
      properties:
        quoteNumber:
          type: string
        customerName:
          type: string
        projectName:
          type: string
        status:
          $ref: "#/components/schemas/QuoteStatus"
        proposalDescription:
          type: string
        createdAt:
          type: string
          format: date-time
        finalSellingPrice:
          type: number
        scope:
          type: array
          items:
            $ref: "#/components/schemas/CustomerProposalLine"
        company:
          $ref: "#/components/schemas/ProposalCompanyPresentation"
        terms:
          type: string
        decision:
          oneOf:
            - $ref: "#/components/schemas/ProposalDecisionPublic"
            - type: "null"
    ProposalDecisionType:
      type: string
      enum: [accepted, declined]
    ProposalDecisionInput:
      type: object
      required: [decision]
      additionalProperties: false
      properties:
        decision:
          $ref: "#/components/schemas/ProposalDecisionType"
        customerName:
          type: string
          minLength: 1
          maxLength: 200
        signature:
          type: string
          minLength: 1
          maxLength: 500
        explanation:
          type: string
          maxLength: 2000
    ProposalDecision:
      type: object
      required:
        - id
        - quoteId
        - revisionNumber
        - tokenIssuedAt
        - decision
        - customerName
        - signature
        - explanation
        - decidedAt
      properties:
        id:
          type: number
        quoteId:
          type: number
        revisionNumber:
          type: number
        tokenIssuedAt:
          type: string
          format: date-time
        decision:
          $ref: "#/components/schemas/ProposalDecisionType"
        customerName:
          type: ["string", "null"]
        signature:
          type: ["string", "null"]
        explanation:
          type: ["string", "null"]
        decidedAt:
          type: string
          format: date-time
    ProposalDecisionPublic:
      type: object
      required: [decision, customerName, decidedAt]
      properties:
        decision:
          $ref: "#/components/schemas/ProposalDecisionType"
        customerName:
          type: ["string", "null"]
        decidedAt:
          type: string
          format: date-time
    ProposalCompanyPresentation:
      type: object
      required: [displayName, accentColor]
      properties:
        displayName:
          type: string
        contactPhone:
          type: ["string", "null"]
        contactEmail:
          type: ["string", "null"]
        contactAddress:
          type: ["string", "null"]
        accentColor:
          type: string
    Quote:
      allOf:
        - $ref: "#/components/schemas/QuoteSummary"
        - type: object
          required:
            - customerEmail
            - jobInputs
            - assembly
            - pricing
            - proposalDescription
            - createdAt
            - proposalDecision
            - proposalDecisions
            - takeoffReview
          properties:
            customerId:
              type: ["number", "null"]
              description: Authenticated contractor-only customer identity used when revising a quote.
            customerEmail:
              type: ["string", "null"]
            jobInputs:
              $ref: "#/components/schemas/QuoteJobInputsSnapshot"
            assembly:
              type: array
              items:
                $ref: "#/components/schemas/AssemblyLine"
            pricing:
              $ref: "#/components/schemas/PricingSummary"
            proposalDescription:
              type: string
            sourceQuoteId:
              type: ["number", "null"]
            revisionNumber:
              type: number
            createdAt:
              type: string
              format: date-time
            proposalDecision:
              oneOf:
                - $ref: "#/components/schemas/ProposalDecision"
                - type: "null"
            proposalDecisions:
              type: array
              items:
                $ref: "#/components/schemas/ProposalDecision"
            takeoffReview:
              oneOf:
                - $ref: "#/components/schemas/TakeoffQuoteSnapshot"
                - type: "null"
    QuoteUpdateResult:
      allOf:
        - $ref: "#/components/schemas/Quote"
        - type: object
          required:
            - proposalShareToken
          properties:
            proposalShareToken:
              type: ["string", "null"]
              description: Rotating signed token issued only for ready customer proposals.
    QuoteInput:
      type: object
      required:
        - customerName
        - projectName
        - module
        - jobInputs
        - proposalDescription
      properties:
        customerId:
          type: number
          minimum: 1
          description: Existing customer ID, validated against the authenticated company.
        sourceQuoteId:
          type: number
          minimum: 1
          description: Optional immutable source quote ID. The server verifies company and module ownership and creates a new revision.
        customerName:
          type: string
          minLength: 1
        customerEmail:
          type: ["string", "null"]
        projectName:
          type: string
          minLength: 1
        module:
          type: string
          enum:
            - EV_CHARGER
            - BATHROOM
            - KITCHEN
            - ADDITION
            - RECESSED_LIGHTING
            - SERVICE_UPGRADE
            - PANEL_REPLACEMENT
            - SERVICE_CALL
            - TIME_MATERIALS
            - CUSTOM
            - NEW_HOUSE
        jobInputs:
          oneOf:
            - $ref: "#/components/schemas/EvChargerInputs"
            - $ref: "#/components/schemas/BathroomInputs"
            - $ref: "#/components/schemas/KitchenInputs"
            - $ref: "#/components/schemas/AdditionInputs"
            - $ref: "#/components/schemas/RecessedLightingInputs"
            - $ref: "#/components/schemas/ServiceUpgradeInputs"
            - $ref: "#/components/schemas/PanelReplacementInputs"
            - $ref: "#/components/schemas/ServiceCallInputs"
            - $ref: "#/components/schemas/TimeMaterialsInputs"
            - $ref: "#/components/schemas/CustomInputs"
            - $ref: "#/components/schemas/NewHouseInputs"
        laborOverride:
          type: ["number", "null"]
          minimum: 0
          maximum: 999999999.99
        sellingPriceOverride:
          type: ["number", "null"]
          minimum: 0
          maximum: 999999999.99
        proposalDescription:
          type: string
          minLength: 1
        takeoffId:
          type: number
          multipleOf: 1
          minimum: 1
    QuoteJobInputsSnapshot:
      description: Immutable saved input snapshot. The open object branch keeps historical quote shapes readable without rewriting them.
      oneOf:
        - $ref: "#/components/schemas/EvChargerInputs"
